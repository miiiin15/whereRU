name: Android CI/CD

on:
  push:
    branches:
      - release/mvp

jobs:
  build-and-distribute:
    if: contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Decode google-services.json from secret
        run: |
          mkdir -p app/src/dev/staging
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > app/src/dev/staging/google-services.json

      - name: Set up keystore file and create local.properties
        run: |
          echo "${{ secrets.KEYSTORE_FILE_B64 }}" | base64 -d > keystore.jks
          echo "KEYSTORE_FILE=$(pwd)/keystore.jks" > local.properties
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> local.properties
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> local.properties
          echo "FCM_PROJECT_ID=${{ secrets.FCM_PROJECT_ID }}" >> local.properties

      - name: Check keystore.jks file
        run: ls -l keystore.jks

      - name: Make google-services.json directories
        run: |
          mkdir -p app/src/dev/debug
          mkdir -p app/src/dev/release
          mkdir -p app/src/prod/debug
          mkdir -p app/src/prod/staging
          mkdir -p app/src/prod/release

      - name: Copy google-services.json for unit tests
        run: |
          cp app/src/dev/staging/google-services.json app/src/dev/debug/google-services.json
          cp app/src/dev/staging/google-services.json app/src/dev/release/google-services.json
          cp app/src/dev/staging/google-services.json app/src/prod/debug/google-services.json
          cp app/src/dev/staging/google-services.json app/src/prod/staging/google-services.json
          cp app/src/dev/staging/google-services.json app/src/prod/release/google-services.json

      - name: Run unit tests
        run: ./gradlew test --stacktrace --warning-mode all

      - name: Build devStaging APK
        run: ./gradlew app:assembleDevStaging --stacktrace --warning-mode all

      - name: Check APK files
        run: find app/build/outputs/apk -name "*.apk"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Get latest commit message
        id: commitmsg
        run: |
          echo "COMMIT_MSG=$(git log -1 --pretty=format:'%s')" >> $GITHUB_ENV

      - name: Distribute to Firebase App Distribution
        run: |
          firebase appdistribution:distribute app/build/outputs/apk/dev/staging/app-dev-staging.apk \
            --app 1:473099601228:android:fe1fbfe3564c68f71d7be9 \
            --groups "mvp" \
            --token ${{ secrets.FIREBASE_TOKEN }} \
            --release-notes "${{ env.COMMIT_MSG }}"